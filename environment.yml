name: rl_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # setuptools>=82 removed pkg_resources, which gym-pybullet-drones still
  # imports (BaseAviary.py). Keep this pin until upstream drops that import.
  - setuptools<82

  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - tqdm
  - tensorboard
  - pip:
      # PyTorch (CUDA 12.6 wheels)
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - torchaudio

      # RL stack
      - gymnasium
      - stable-baselines3[extra]

      # Simulation (pybullet compiles from source on 3.12, needs gcc)
      - git+https://github.com/learnsyslab/gym-pybullet-drones.git

      # Hugging Face
      - huggingface_hub
      - safetensors

      # Optional experiment logging
      - wandb
